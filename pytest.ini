[pytest]
# 测试标记定义
markers =
    unit: 单元测试（快速，不依赖外部资源）
    integration: 集成测试（需要测试数据库）
    e2e: 端到端测试（完整流程）
    performance: 性能测试（时间较长）
    slow: 慢速测试（>10秒）

# 测试发现配置
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 输出配置
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -p no:cacheprovider

# 日志配置
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 异步支持
asyncio_mode = auto

# 覆盖率配置
[coverage:run]
source = utils,realtime_kline_service
omit =
    */tests/*
    */__pycache__/*
    */venv/*
    */.venv/*

[coverage:report]
precision = 2
show_missing = true
skip_covered = false

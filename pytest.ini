[pytest]
# 测试路径配置
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# pytest 选项
addopts = 
    -v 
    --strict-markers
    --cov=utils.timescaledb
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --tb=short
    --color=yes

# 测试标记定义
markers =
    unit: 单元测试（Mock隔离，不需要真实数据库）
    integration: 集成测试（需要真实数据库）
    performance: 性能基准测试
    slow: 慢速测试（执行时间>5秒）

# 超时配置
timeout = 300
timeout_method = thread

# 覆盖率配置
[coverage:run]
source = utils
omit = 
    */tests/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
